intent: Make the required checks runnable so agent PRs can go green and auto-merge (development plan, phase 0)
why: PR Checks call test scripts that do not exist, so PRs 1 to 3 cannot merge. docs/DEVELOPMENT.md phase 0
issue: 0
inputs:
  score_pdf: none
  take: none
  part: none
  reference_source: none
scope:
  paths:
    - "package.json"
    - "package-lock.json"
    - "scripts/audio-quality.sh"
    - "scripts/check-songs.mjs"
    - "tests/*"
    - ".github/workflows/pr-checks.yml"
    - ".github/workflows/governance.yml"
    - "docs/*"
steps:
  - package.json with vitest and the scripts the checks call (test:unit, test:songs)
  - scripts/check-songs.mjs validates every songs/*/reference.json
  - scripts/audio-quality.sh checks sample rate, length, clipping and silence of test takes with ffmpeg
  - Synthetic test take generated by code (no choir audio)
  - llm-evals skips with a notice when the OpenRouter secret is absent (forks never get it)
  - ux-validator runs only when repo variable UX_VALIDATOR_ENABLED is true (no page yet)
  - automerge uses the GitHub App when configured, else GITHUB_TOKEN
  - After merge, outside the diff - ruleset on main with required checks and no bypass, then enable auto-merge
success_criteria:
  - All PR Checks jobs pass or skip on this PR
  - Ruleset requires plan-gate, risk-tier, gitleaks, unit, audio-quality, llm-evals, song-regression
  - PR 1 merges after main is merged into it and its checks pass
risk: high
rollback: Revert the PR and delete the ruleset
