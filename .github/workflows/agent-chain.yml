name: Agent Chain

# When a phase issue closes (its PR merged), hand the next open phase to the agent.
on:
  issues:
    types: [closed]

permissions:
  contents: read

jobs:
  next:
    if: contains(github.event.issue.labels.*.name, 'phase') && github.event.issue.state_reason == 'completed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - name: Label the next phase
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          next=$(gh issue list -R "$REPO" --label phase --state open --json number,labels \
            --jq '[.[] | select(([.labels[].name] | index("human")) | not)] | sort_by(.number) | .[0].number // empty')
          if [ -z "$next" ]; then echo "No open agent phase left"; exit 0; fi
          gh issue edit "$next" -R "$REPO" --add-label agent:ready
          echo "Handed issue #$next to the agent"
